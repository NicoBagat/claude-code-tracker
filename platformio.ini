[platformio]
default_envs = esp32dev

; ── Active target ────────────────────────────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
lib_deps  =
    h2zero/NimBLE-Arduino @ ^1.4.2
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
    -DBOARD_ESP32
monitor_speed = 115200

; ── Deferred target (UNO R4 WiFi — port pending HAL implementation) ──────────
